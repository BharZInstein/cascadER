name: Model smoke test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q src scripts
      - name: Verify model artifact hashes
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('models')
          for name, expected in json.loads((root / 'SHA256SUMS.json').read_text()).items():
              assert hashlib.sha256((root / name).read_bytes()).hexdigest() == expected, name
          PY
      - name: Run full inference on fictional records
        run: python scripts/run_demo.py
      - name: Verify completed run can be reopened
        run: python scripts/run_demo.py
